name: AREA 67 GIS data acquisition and audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gis-data-acquisition.yml
      - src/data/ci_gis_audit.py
      - tests/test_ci_gis_audit.py
      - src/data/build_exploratory_pilot.py
      - config/exploratory_pilot_2026-11-15.json
      - tests/test_exploratory_pilot_builder.py
  workflow_dispatch:
    inputs:
      dataset:
        description: Public datasets to acquire
        required: true
        type: choice
        options:
          - both
          - earth
          - moon
        default: both
      include_rois:
        description: Also acquire official PGDA ROI archives (optional)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: area67-gis-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Acquire Earth candidate DEM source tiles
        id: earth_acquire
        if: github.event_name == 'push' || inputs.dataset == 'earth' || inputs.dataset == 'both'
        continue-on-error: true
        run: |
          python -m src.data.earth_dem_acquisition \
            --sites haughton mcmurdo askja mauna_kea yungay \
            --confirm-download --max-file-mb 250

      - name: Acquire lunar LOLA layers for Site01 and Site04
        id: moon_acquire
        if: github.event_name == 'push' || inputs.dataset == 'moon' || inputs.dataset == 'both'
        continue-on-error: true
        run: |
          python -m src.data.lola_south_pole download \
            --sites Site01 Site04 \
            --assets elevation counts slope z_uncertainty slope_uncertainty \
            --confirm-download --max-file-mb 500

      - name: Acquire and inspect official lunar ROI archives
        id: roi_acquire
        if: (github.event_name == 'push' || inputs.include_rois == true) && (github.event_name == 'push' || inputs.dataset == 'moon' || inputs.dataset == 'both')
        continue-on-error: true
        run: |
          python -m src.data.lola_roi_acquisition download \
            --sites Site01 Site04 --confirm-download --max-archive-mb 50
          python -m src.data.lola_roi_acquisition inspect --sites Site01 Site04

      - name: Audit lunar ROI support and uncertainty by provider polygon
        if: always() && steps.roi_acquire.outcome == 'success' && steps.moon_acquire.outcome == 'success'
        run: |
          python -m src.data.lola_roi_quality --sites Site01 Site04

      - name: Inventory and structurally preflight every acquired raster
        if: always()
        run: |
          python -m src.data.ci_gis_audit

      - name: Rebuild exploratory Site01-to-Earth pilot with canonical methods
        id: pilot_build
        if: success() && steps.earth_acquire.outcome == 'success' && steps.moon_acquire.outcome == 'success'
        run: |
          python -m src.data.build_exploratory_pilot \
            --raw-root data/raw \
            --output-dir data/processed \
            --metadata-dir data/metadata/pilot_2026-11-15 \
            --config config/exploratory_pilot_2026-11-15.json

      - name: Run terrain fingerprint and GIS data tests
        if: always()
        run: |
          python -m pytest -q \
            tests/test_terrain_fingerprint.py \
            tests/test_raster_inventory.py \
            tests/test_raster_preflight.py \
            tests/test_lola_site04_qa.py \
            tests/test_lola_south_pole.py \
            tests/test_lola_roi_acquisition.py \
            tests/test_lola_roi_quality.py \
            tests/test_exploratory_pilot_builder.py

      - name: Upload raw acquisition data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area67-gis-raw-${{ github.event_name == 'push' && 'both' || inputs.dataset }}-${{ github.run_id }}
          path: |
            data/raw/earth/
            data/raw/moon/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compact GIS audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area67-gis-reports-${{ github.run_id }}
          path: |
            data/metadata/ci_gis_audit/
            data/metadata/lola_south_pole/
            data/metadata/lola_rois/
            data/metadata/lola_roi_quality/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload exploratory pilot outputs
        if: always() && steps.pilot_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: area67-exploratory-pilot-${{ github.run_id }}
          path: |
            data/processed/terrain_fingerprints.csv
            data/processed/candidate_rankings.csv
            data/processed/ranking_robustness.json
            data/processed/pilot_2026-11-15/
            data/metadata/pilot_2026-11-15/
          if-no-files-found: error
          retention-days: 14

      - name: Report acquisition failures after preserving the artifact
        if: always()
        shell: bash
        env:
          EARTH_OUTCOME: ${{ steps.earth_acquire.outcome }}
          MOON_OUTCOME: ${{ steps.moon_acquire.outcome }}
          ROI_OUTCOME: ${{ steps.roi_acquire.outcome }}
          PILOT_OUTCOME: ${{ steps.pilot_build.outcome }}
        run: |
          failed=0
          for outcome in "$EARTH_OUTCOME" "$MOON_OUTCOME" "$ROI_OUTCOME"; do
            if [[ "$outcome" == "failure" ]]; then
              echo "::error::At least one acquisition step failed; inspect its logs and the uploaded partial artifact."
              failed=1
            fi
          done
          if [[ "$PILOT_OUTCOME" == "failure" ]]; then
            echo "::error::The canonical exploratory pilot rebuild failed; inspect the pilot step logs."
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
