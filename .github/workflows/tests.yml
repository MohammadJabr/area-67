name: AREA 67 app and data-contract tests

on:
  push:
    branches:
      - main
      - feature/mohammad-app-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas pytest

      - name: Compile application and source modules
        run: python -m compileall -q app src tests

      - name: Run data-contract and Analog Passport tests
        run: python -m pytest -q
